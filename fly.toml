app = "verbalizetext"
primary_region = "ewr"

[build]

[http_service]
  internal_port = 80
  force_https = true
  # A static site with no state: let it sleep when idle and wake on request.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
