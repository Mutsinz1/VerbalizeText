server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 512;

    # Filenames are not fingerprinted, so the browser must revalidate rather
    # than serve a stale script.js after a redeploy.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # Images never change under the same name, so they can be held longer.
    location /img/ {
        add_header Cache-Control "public, max-age=86400";
    }
}
