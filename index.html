<!-- Reference: https://developer.mozilla.org/en-US/docs/Web/API/SpeechSynthesis -->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="VerbalizeText turns typed text into natural-sounding speech in your browser, with a board of one-tap phrases and adjustable voice, speed, pitch and volume."
    />
    <meta name="theme-color" content="#800d97" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎧</text></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wdth,wght@75..100,400..700&display=swap"
    />
    <link rel="stylesheet" href="style.css" />
    <title>VerbalizeText</title>
  </head>
  <body>
    <a class="skip-link" href="#board">Skip to phrase board</a>

    <header class="container">
      <h1>VerbalizeText 🎧</h1>
      <p class="tagline">Tap a phrase, or type your own, and hear it spoken aloud.</p>

      <p id="unsupported" class="banner" role="alert" hidden>
        This browser doesn&rsquo;t support the Web Speech API, so nothing can be
        spoken here. Try the latest Chrome, Edge, or Safari.
      </p>

      <div class="controls">
        <button id="toggle" class="btn btn-primary" type="button">
          Type your own text
        </button>
        <button id="pause" class="btn btn-ghost" type="button" disabled>
          Pause
        </button>
        <button id="stop" class="btn btn-ghost" type="button" disabled>
          Stop
        </button>
      </div>

      <p id="status" class="status" role="status" aria-live="polite"></p>
    </header>

    <main id="board" class="board" aria-label="Quick phrases" tabindex="-1"></main>

    <dialog id="text-box" class="text-box" aria-labelledby="dialog-title">
      <form method="dialog" class="text-box-head">
        <h2 id="dialog-title">Speak your own text</h2>
        <button class="close" type="submit" aria-label="Close">&times;</button>
      </form>

      <label class="field-label" for="voices">Voice</label>
      <select id="voices">
        <option value="">Loading voices&hellip;</option>
      </select>

      <label class="field-label" for="text" id="text-label">Text to read</label>
      <textarea id="text" placeholder="Enter text to read&hellip;"></textarea>

      <!-- Shown in place of the textarea while reading, to follow the words.
           aria-hidden because the same text is already available in the
           textarea, and a screen reader has its own reading position. -->
      <p class="field-label" id="reading-label" hidden>Reading</p>
      <div id="reading" class="reading" aria-hidden="true" hidden></div>

      <div class="sliders">
        <div class="slider">
          <label for="rate">Speed</label>
          <input id="rate" type="range" min="0.5" max="2" step="0.1" value="1" />
          <output for="rate" id="rate-value">1.0&times;</output>
        </div>
        <div class="slider">
          <label for="pitch">Pitch</label>
          <input id="pitch" type="range" min="0" max="2" step="0.1" value="1" />
          <output for="pitch" id="pitch-value">1.0</output>
        </div>
        <div class="slider">
          <label for="volume">Volume</label>
          <input id="volume" type="range" min="0" max="1" step="0.05" value="1" />
          <output for="volume" id="volume-value">100%</output>
        </div>
      </div>

      <button class="btn btn-primary btn-block" id="read" type="button">
        Read aloud
      </button>

      <!-- The dialog is modal, so the controls in the header are inert while
           it is open. Reading needs its own transport. -->
      <div class="dialog-transport" id="dialog-transport" hidden>
        <button class="btn btn-primary" id="dialog-pause" type="button">
          Pause
        </button>
        <button class="btn btn-outline" id="dialog-stop" type="button">
          Stop
        </button>
        <button class="btn btn-outline" id="dialog-edit" type="button">
          Edit text
        </button>
      </div>
    </dialog>

    <noscript>
      <p class="banner container">
        VerbalizeText needs JavaScript enabled to read text aloud.
      </p>
    </noscript>

    <script src="script.js"></script>
  </body>
</html>
